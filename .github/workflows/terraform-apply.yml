name: Terraform Apply

# Déclenché manuellement uniquement (workflow_dispatch) : provisionner/modifier une infra
# facturée (dont une instance GPU) ne doit jamais être une conséquence automatique d'un push.
# Protégé par l'environnement GitHub "production" — à configurer dans Settings > Environments
# avec au moins un reviewer requis (approbation humaine obligatoire avant exécution), voir
# README.md.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Tapez "apply" pour confirmer (provisionne de vraies ressources facturées)'
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    if: github.event.inputs.confirm == 'apply'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: terraform/environments/dev
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Authentification AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: eu-west-3

      - name: Init
        run: terraform init -backend-config=backend.hcl

      - name: Apply
        run: terraform apply -auto-approve
