name: Terraform

# - Pull request touchant terraform/ : plan, publié en commentaire de la PR.
# - Lancement manuel (Actions > Terraform > Run workflow) : apply, soumis à l'approbation de
#   l'environnement GitHub « production ».
# Authentification AWS par OIDC : aucune clé stockée dans GitHub (voir docs/06-ci-cd.md).
on:
  pull_request:
    paths: ["terraform/**"]
  workflow_dispatch:
    inputs:
      action:
        description: "plan ou apply"
        type: choice
        options: [plan, apply]
        default: plan

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: terraform-prod
  cancel-in-progress: false

env:
  TF_DIR: terraform/environments/prod
  TF_IN_AUTOMATION: "true"
  TF_VAR_email_alertes: ${{ vars.EMAIL_ALERTES }}
  # Domaine géré par Route 53 (vide : sslip.io) : doit être identique à celui du poste.
  TF_VAR_domaine: ${{ vars.DOMAINE }}

jobs:
  plan:
    if: github.event_name == 'pull_request' || inputs.action == 'plan'
    name: Plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TERRAFORM }}
          aws-region: eu-west-3
      - name: Init
        run: >
          terraform -chdir="$TF_DIR" init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=prod/terraform.tfstate"
          -backend-config="region=eu-west-3"
          -backend-config="use_lockfile=true"
      - name: Plan
        id: plan
        run: terraform -chdir="$TF_DIR" plan -input=false -no-color -lock-timeout=5m | tee plan.txt
      - name: Commenter la PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan.txt', 'utf8');
            const extrait = plan.length > 60000 ? plan.slice(-60000) : plan;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
              body: "### Terraform plan (prod)\n```\n" + extrait + "\n```",
            });

  apply:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
    name: Apply
    runs-on: ubuntu-latest
    environment: production   # approbation manuelle requise
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TERRAFORM }}
          aws-region: eu-west-3
      - name: Init
        run: >
          terraform -chdir="$TF_DIR" init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=prod/terraform.tfstate"
          -backend-config="region=eu-west-3"
          -backend-config="use_lockfile=true"
      - name: Apply
        run: terraform -chdir="$TF_DIR" apply -input=false -auto-approve -lock-timeout=5m
