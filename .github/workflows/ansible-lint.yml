name: Ansible Lint

on:
  pull_request:
    paths:
      - "ansible/**"
  push:
    branches: [main]
    paths:
      - "ansible/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Ansible et les collections
        run: |
          pip install ansible ansible-lint
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: ansible-lint
        run: ansible-lint ansible/playbooks ansible/roles

      - name: Vérification syntaxique des playbooks
        working-directory: ansible
        run: |
          for playbook in playbooks/*.yml; do
            ansible-playbook "$playbook" --syntax-check -i inventory/aws_ec2.yml || true
          done
