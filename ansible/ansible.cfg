[defaults]
inventory = inventory/aws_ec2.yml
roles_path = roles
collections_path = ~/.ansible/collections
stdout_callback = ansible.builtin.default
result_format = yaml
host_key_checking = False
retry_files_enabled = False
# Exécuter les handlers (rechargements de services) même si une tâche ultérieure échoue.
force_handlers = True
interpreter_python = auto_silent
forks = 5
timeout = 60

[ssh_connection]
pipelining = True
