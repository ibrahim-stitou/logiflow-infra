[defaults]
inventory       = inventory/aws_ec2.yml
remote_user     = ubuntu
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
roles_path      = roles

# Exécution en parallèle sur les hôtes (comportement par défaut d'Ansible, explicité ici) :
# les 3 rôles de service (backend/ai/frontend) ne dépendent pas les uns des autres au
# déploiement, `forks` couvre donc large sans qu'aucun `serial` ne soit nécessaire.
forks = 10

[ssh_connection]
# Connexion via un tunnel SSM (voir inventory/aws_ec2.yml et scripts/ssm-proxy.sh) : pas
# d'IP publique ni de port 22 ouvert sur backend/ai, uniquement sur frontend.
pipelining = True
