# Inventaire dynamique : le serveur est trouvé par ses étiquettes (posées par Terraform), aucune
# IP en dur. Connexion par AWS SSM Session Manager (aucun port SSH ouvert, aucune clé).
plugin: amazon.aws.aws_ec2
regions:
  - eu-west-3
filters:
  tag:Projet: logiflow
  tag:Environnement: prod
  instance-state-name: running
hostnames:
  - instance-id
keyed_groups:
  - key: tags.Role
    prefix: role
    separator: "_"
compose:
  ansible_host: instance_id
groups:
  logiflow: true
