---
- name: Lire le mot de passe DB depuis AWS Secrets Manager
  ansible.builtin.set_fact:
    backend_db_password: "{{ lookup('amazon.aws.secretsmanager_secret', secret_db_password_name, region=aws_region) }}"
  no_log: true

- name: Lire la clé API interne depuis AWS Secrets Manager
  ansible.builtin.set_fact:
    backend_internal_api_key: "{{ lookup('amazon.aws.secretsmanager_secret', secret_internal_api_key_name, region=aws_region) }}"
  no_log: true

- name: Déployer le fichier .env (jamais commité, généré à chaque run)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ docker_compose_dir }}/.env"
    owner: ubuntu
    group: docker
    mode: "0640"
  no_log: true

- name: Déployer le docker-compose.yml du backend
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ docker_compose_dir }}/docker-compose.yml"
    owner: ubuntu
    group: docker
    mode: "0640"

- name: Se connecter à GHCR (si les images sont privées)
  community.docker.docker_login:
    registry_url: ghcr.io
    username: "{{ ghcr_username | default(omit) }}"
    password: "{{ ghcr_token | default(omit) }}"
  when: ghcr_token is defined
  no_log: true

- name: Démarrer PostgreSQL et le backend
  community.docker.docker_compose_v2:
    project_src: "{{ docker_compose_dir }}"
    pull: always
    state: present

- name: Attendre que l'API réponde sur /actuator/health
  ansible.builtin.uri:
    url: "http://localhost:{{ host_port }}/actuator/health"
    status_code: 200
  register: backend_health
  until: backend_health.status == 200
  retries: 12
  delay: 10
