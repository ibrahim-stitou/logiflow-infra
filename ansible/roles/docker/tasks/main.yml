---
- name: Installer les prérequis pour le dépôt APT Docker
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Ajouter le dépôt APT Docker
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_distribution_release }}"
    components: stable
    architectures: "{{ ansible_architecture == 'x86_64' | ternary('amd64', 'arm64') }}"
    signed_by: https://download.docker.com/linux/ubuntu/gpg

- name: Installer Docker Engine et le plugin Compose
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Ajouter l'utilisateur ubuntu au groupe docker
  ansible.builtin.user:
    name: ubuntu
    groups: docker
    append: true

- name: Démarrer et activer Docker
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Créer le répertoire de déploiement applicatif
  ansible.builtin.file:
    path: "{{ docker_compose_dir }}"
    state: directory
    owner: ubuntu
    group: docker
    mode: "0750"
