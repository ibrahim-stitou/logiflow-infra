---
# Docker Engine et le plugin Compose, depuis le dépôt officiel de Docker.

- name: Créer le répertoire des clés APT
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Installer la clé du dépôt Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Déclarer le dépôt Docker
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable
    filename: docker
    state: present

- name: Installer Docker Engine et Compose
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

# Durcissement : aucun conteneur ne peut gagner de privilèges (setuid) ; ports publiés par
# iptables uniquement (pas de proxy utilisateur : l'IP réelle du client est conservée, ce dont
# CrowdSec a besoin).
- name: Configurer le démon Docker (journaux, durcissement)
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "5" },
        "live-restore": true,
        "no-new-privileges": true,
        "userland-proxy": false
      }
    mode: "0644"
  notify: Redémarrer Docker

- name: Démarrer Docker au démarrage du serveur
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true
