---
# Rôle générique : suppose une image Docker nginx servant un build Angular statique, produite par
# la CI d'un futur dépôt `logiflow-frontend` (non créé à ce stade — voir docs/architecture.md).
# À adapter (variables d'environnement de build, éventuel reverse proxy vers le backend) une fois
# ce dépôt disponible.

- name: Déployer le docker-compose.yml du frontend
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ docker_compose_dir }}/docker-compose.yml"
    owner: ubuntu
    group: docker
    mode: "0640"

- name: Démarrer le frontend
  community.docker.docker_compose_v2:
    project_src: "{{ docker_compose_dir }}"
    pull: always
    state: present

- name: Attendre que le frontend réponde
  ansible.builtin.uri:
    url: "http://localhost:{{ host_port }}/"
    status_code: 200
  register: frontend_health
  until: frontend_health.status == 200
  retries: 12
  delay: 10
