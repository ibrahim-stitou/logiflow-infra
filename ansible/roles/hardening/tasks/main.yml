---
# Durcissement de base, appliqué aux 3 instances avant tout déploiement applicatif. Défense en
# profondeur : les security groups AWS bloquent déjà l'essentiel du trafic non désiré, mais un
# pare-feu local + fail2ban + des mises à jour automatiques restent une bonne pratique standard,
# notamment si une instance est un jour repositionnée dans un sous-réseau plus ouvert.

- name: Mettre à jour le cache APT et appliquer les mises à jour de sécurité
  ansible.builtin.apt:
    update_cache: true
    upgrade: safe
    cache_valid_time: 3600

- name: Installer les paquets de durcissement de base
  ansible.builtin.apt:
    name:
      - ufw
      - fail2ban
      - unattended-upgrades
      - apt-listchanges
    state: present

- name: Activer les mises à jour de sécurité automatiques
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"

- name: Interdire l'authentification SSH par mot de passe (clé uniquement)
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PasswordAuthentication"
    line: "PasswordAuthentication no"
  notify: Redémarrer sshd

- name: Interdire la connexion SSH root
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PermitRootLogin"
    line: "PermitRootLogin no"
  notify: Redémarrer sshd

- name: Configurer UFW — politique par défaut (deny incoming, allow outgoing)
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming

- name: Configurer UFW — autoriser SSH uniquement depuis le VPC (tunnel SSM local au réseau)
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    src: "{{ vpc_cidr }}"

- name: Configurer UFW — autoriser le port applicatif du service depuis le VPC
  community.general.ufw:
    rule: allow
    port: "{{ container_port | string }}"
    proto: tcp
    src: "{{ vpc_cidr }}"
  when: container_port is defined

- name: Configurer UFW — autoriser HTTP/HTTPS publics (frontend uniquement)
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: ["80", "443"]
  when: "'role_frontend' in group_names"

- name: Activer fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: started
    enabled: true
