---
# Playbook maître : durcissement + Docker sur les 3 hôtes, puis déploiement du service propre à
# chaque groupe. Ansible exécute chaque play sur tous ses hôtes cibles EN PARALLÈLE par défaut
# (voir `forks` dans ansible.cfg) — aucune des 3 instances ne dépend du déploiement d'une autre.
#
#   ansible-playbook playbooks/site.yml

- name: Socle commun (durcissement, Docker)
  hosts: all
  become: true
  roles:
    - hardening
    - docker
    - monitoring

- name: Déployer le backend (Spring Boot + PostgreSQL)
  hosts: role_backend
  become: true
  roles:
    - backend

- name: Déployer le service IA (Flask + Ollama)
  hosts: role_ai
  become: true
  roles:
    - ai

- name: Déployer le frontend (Angular/nginx)
  hosts: role_frontend
  become: true
  roles:
    - frontend
