# Stack de production LogiFlow : toute l'application sur un seul hôte Docker.
#
#   Internet ──HTTPS──▶ caddy ─┬─ app.<domaine>/api/*  ──▶ backend  (Spring Boot)
#                              ├─ app.<domaine>/*      ──▶ frontend (Angular / nginx)
#                              └─ auth.<domaine>/*     ──▶ keycloak (OIDC)
#   backend ──▶ ai (Flask, agents IA) ──▶ LLM (Groq), OSRM
#   backend, ai, keycloak ──▶ postgres (bases logiflow, logiflow_ai, keycloak)
#
# Seul Caddy publie des ports (80/443). Tout le reste communique sur le réseau interne.
# Variables : .env (voir .env.example). Déployée sur l'EC2 par Ansible dans /opt/logiflow ;
# utilisable aussi en local : `make local-up` (voir docs/03-tester-en-local.md).

name: logiflow

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN manquant}
      AUTH_DOMAIN: ${AUTH_DOMAIN:?AUTH_DOMAIN manquant}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-sites:/etc/caddy/sites:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - backend
      - keycloak
    mem_limit: 128m
    logging: *logging

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE manquant}
    restart: unless-stopped
    environment:
      AUTH_MODE: keycloak
      KEYCLOAK_URL: https://${AUTH_DOMAIN}
      KEYCLOAK_REALM: logiflow
      KEYCLOAK_CLIENT_ID: logiflow-frontend
    mem_limit: 64m
    logging: *logging

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE manquant}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: -XX:+UseContainerSupport -XX:MaxRAMPercentage=70.0
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: logiflow
      DB_USER: logiflow
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant}
      # Données de démonstration : ajoutées par `DEMO_DATA=true` (voir .env.example).
      FLYWAY_LOCATIONS: ${FLYWAY_LOCATIONS:-classpath:db/migration}
      # iss des jetons = URL publique ; les clés sont lues par le réseau interne.
      OAUTH2_ISSUER_URI: https://${AUTH_DOMAIN}/realms/logiflow
      OAUTH2_JWK_SET_URI: http://keycloak:8080/realms/logiflow/protocol/openid-connect/certs
      MFA_REQUIRED: ${MFA_REQUIRED:-false}
      CORS_ALLOWED_ORIGINS: https://${APP_DOMAIN}
      ACTUATOR_EXPOSE: health,info,metrics,prometheus
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
      STORAGE_LOCAL_PATH: /data/uploads
      AI_SERVICE_BASE_URL: http://ai:8000
      AI_SERVICE_API_KEY: ${AI_INTERNAL_API_KEY:?AI_INTERNAL_API_KEY manquant}
      AI_SERVICE_CALLBACK_API_KEY: ${AI_CALLBACK_API_KEY:?AI_CALLBACK_API_KEY manquant}
      AI_SERVICE_READ_TIMEOUT: 90s
      AI_MAINTENANCE_ANALYSE_NOCTURNE: ${AI_MAINTENANCE_ANALYSE_NOCTURNE:-true}
      AI_MAINTENANCE_CRON: ${AI_MAINTENANCE_CRON:-0 30 8 * * MON-FRI}
    volumes:
      - backend-uploads:/data/uploads
    mem_limit: 1536m
    logging: *logging

  ai:
    image: ${AI_IMAGE:?AI_IMAGE manquant}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      INTERNAL_API_KEY: ${AI_INTERNAL_API_KEY}
      DATABASE_URL: postgresql+psycopg://logiflow_ai:${AI_DB_PASSWORD:?AI_DB_PASSWORD manquant}@postgres:5432/logiflow_ai
      BACKEND_BASE_URL: http://backend:8080
      BACKEND_CALLBACK_API_KEY: ${AI_CALLBACK_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}
      EMBED_BASE_URL: ${EMBED_BASE_URL:-}
      EMBED_API_KEY: ${EMBED_API_KEY:-}
      EMBED_MODEL: ${EMBED_MODEL:-}
      OSRM_BASE_URL: ${OSRM_BASE_URL:-https://router.project-osrm.org}
      LOG_LEVEL: INFO
    mem_limit: 768m
    logging: *logging

  keycloak:
    image: ${KEYCLOAK_IMAGE:?KEYCLOAK_IMAGE manquant}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["start", "--optimized", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD manquant}
      KC_HOSTNAME: https://${AUTH_DOMAIN}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD manquant}
      JAVA_OPTS_KC_HEAP: -XX:MaxRAMPercentage=65.0
      # Remplacés par Keycloak dans keycloak/realm-logiflow.json à l'import.
      LOGIFLOW_APP_URL: https://${APP_DOMAIN}
    volumes:
      - ./keycloak/realm-logiflow.json:/opt/keycloak/data/import/realm-logiflow.json:ro
    healthcheck:
      # Port de gestion (9000) : /health/ready, sans curl dans l'image Keycloak.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    mem_limit: 1024m
    logging: *logging

  # Tâche ponctuelle : configure le realm après import (force brute, utilisateurs de démo si
  # DEMO_DATA=true). Idempotente, rejouée à chaque déploiement.
  keycloak-init:
    image: ${KEYCLOAK_IMAGE}
    restart: "no"
    depends_on:
      keycloak:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/init/init-keycloak.sh"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      DEMO_DATA: ${DEMO_DATA:-false}
      DEMO_USERS_PASSWORD: ${DEMO_USERS_PASSWORD:-}
      LOGIFLOW_APP_URL: https://${APP_DOMAIN}
    volumes:
      - ./keycloak/init-keycloak.sh:/init/init-keycloak.sh:ro
    logging: *logging

  postgres:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE manquant}
    restart: unless-stopped
    environment:
      POSTGRES_DB: logiflow
      POSTGRES_USER: logiflow
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      # Utilisés par postgres/init/01-bases.sh (premier démarrage uniquement).
      AI_DB_PASSWORD: ${AI_DB_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logiflow -d logiflow"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 256m
    mem_limit: 1024m
    logging: *logging

volumes:
  postgres-data:
  backend-uploads:
  caddy-data:
  caddy-config:
